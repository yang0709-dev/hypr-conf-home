# Time
label {
    monitor =
    # text = cmd[update:1000] printf '<span>%s\n%s</span>' "$(date +%I)" "$(date +%M)"
    # text = cmd[update:1000] printf '<span line_height="0.7">%s\n%s</span>' "$(date +%I)" "$(date +%M)"
    text = cmd[update:1000] echo "<span>$(date +"%I:%M")</span>"
    color = rgba(216, 222, 233, 0.80)
    font_size = 120
    font_family = SF Pro Display Bold
    position = 0, 50
    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 5
    shadow_color = rgba(0,0,0,0.9)
    shadow_offset = 0, 0
}

# Day-Month-Date
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%A, %B %d")"
    color = rgba(216, 222, 233, .80)
    font_size = 25
    font_family = SF Pro Display Bold
    position = 0, -50
    halign = center
    valign = center

    
    shadow_passes = 2
    shadow_size = 5
    shadow_color = rgba(0,0,0,0.9)
    shadow_offset = 0, 0
}

