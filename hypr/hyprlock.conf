# INPUT FIELD
input-field {
    monitor =
    size = 320, 55
    outline_thickness = 3
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.5)
    inner_color = rgba(154, 200, 245, 0.1)
    font_color = rgb(255, 255, 255)
    fade_on_empty = true
    font_family = SF Pro Display Bold
    placeholder_text =
    hide_input = false
    position = 0, -368
    halign = center
    valign = center
}
